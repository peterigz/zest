name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          #Debug on Windows, as zest-tests needs ZEST_DEBUGGING. The SDK has no SDL2 here, so the configure downloads it.
          - name: Windows, Vulkan SDK
            os: windows-2022
            generator: "Visual Studio 17 2022"
            config: Debug
            install_vulkan_sdk: true
          #No Vulkan SDK: D3D12 only, with SDL2 downloaded
          - name: Windows, no SDK
            os: windows-2022
            generator: "Visual Studio 17 2022"
            config: Debug
            install_vulkan_sdk: false
          - name: Linux
            os: ubuntu-latest
            generator: "Unix Makefiles"
            apt_packages: "libvulkan-dev libsdl2-dev libshaderc-dev glslang-dev spirv-tools"
          #No shaderc: catches a shaderc reference left outside the ZEST_NO_SHADERC guards
          - name: Linux, no shaderc
            os: ubuntu-latest
            generator: "Unix Makefiles"
            apt_packages: "libvulkan-dev libsdl2-dev"
            cmake_args: "-DZEST_ENABLE_SHADERC=OFF"
          - name: macOS, Vulkan and Metal
            os: macos-latest
            generator: "Unix Makefiles"
            brew_packages: "sdl2 vulkan-loader vulkan-headers molten-vk shaderc glslang spirv-tools spirv-cross"
          #No Vulkan SDK: Metal only, with shaderc and SPIRV-Cross from Homebrew
          - name: macOS, no SDK
            os: macos-latest
            generator: "Unix Makefiles"
            brew_packages: "sdl2 shaderc spirv-cross"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Vulkan SDK installation
      #The debug component has shaderc_combinedd.lib, which a Debug build links. Uncached, as the action's cache key leaves out the components.
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows' && matrix.install_vulkan_sdk
        uses: jakoch/install-vulkan-sdk-action@v1.0.5
        with:
          vulkan_version: 1.3.296.0
          optional_components: com.lunarg.vulkan.debug
          cache: false

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ${{ matrix.brew_packages }}

      #Fails when a file in builtin_shaders/ changed without its embedded array being regenerated
      - name: Check embedded built-in shaders
        if: matrix.name == 'Linux'
        run: cmake -DCHECK=ON -P builtin_shaders/embed_builtin_shaders.cmake

      - name: Configure
        run: cmake -B build -G "${{ matrix.generator }}" ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config || 'Release' }}
